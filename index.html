<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Jossie | WhatsApp</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #075e54, #25d366);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #075e54;
            margin-bottom: 10px;
        }

        .username {
            color: #777;
            margin-bottom: 15px;
        }

        .number {
            font-size: 18px;
            margin-bottom: 25px;
            color: #333;
        }

        .whatsapp-btn {
            display: inline-block;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .whatsapp-btn:hover {
            background: #128c7e;
            transform: scale(1.05);
        }

        footer {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">💬</div>

        <h1>Engineer Jossie</h1>

        <p class="username">@engineer_jossie</p>

        <p class="number">+254 708 015910</p>

        <a class="whatsapp-btn"
           href="https://wa.me/254708015910"
           target="_blank">
           Chat on WhatsApp
        </a>

        <footer>
            Powered by WhatsApp
        </footer>

    </div>

</body>
</html>
